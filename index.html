<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e74c3c">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<title>🏠 家庭点菜</title>
</head>
<body>

<!-- 密码锁 -->
<div class="screen" id="lockScreen">
  <div class="auth-container"><div class="auth-card" style="text-align:center;">
    <div class="auth-logo">🏠</div>
    <div class="auth-title">家庭点菜</div>
    <div id="lockNew"><p style="margin:10px 0;color:var(--text-light);">首次使用，设置家庭密码</p><div class="form-group"><input type="password" id="pin1" placeholder="输入密码" maxlength="20" style="text-align:center;font-size:1.2rem;letter-spacing:4px;"></div><div class="form-group"><input type="password" id="pin2" placeholder="再次输入" maxlength="20" style="text-align:center;font-size:1.2rem;letter-spacing:4px;"></div><button class="btn-auth" onclick="setPin()">🔒 设置</button></div>
    <div id="lockEnter" style="display:none;"><div class="auth-error" id="pinErr"></div><div class="form-group"><input type="password" id="pin3" placeholder="输入密码" maxlength="20" style="text-align:center;font-size:1.2rem;letter-spacing:4px;" autocomplete="off"></div><button class="btn-auth" onclick="enterPin()">🔓 解锁</button></div>
    <p style="margin-top:16px;font-size:0.75rem;color:var(--text-lighter);"><a onclick="resetAll()" style="color:var(--text-lighter);cursor:pointer;">忘记密码？重置（会清空数据）</a></p>
  </div></div>
</div>

<!-- 主应用 -->
<div class="screen" id="mainScreen">
<header class="header"><div class="header-inner"><h1 class="logo" onclick="sT('menu')">🏠 家庭点菜</h1><div class="header-actions"><button class="btn-icon" onclick="sT('manage')">⚙️</button><button class="btn-icon" onclick="sT('history')">📋</button><button class="btn-icon cart-badge-wrapper" onclick="tC()">🛒<span class="cart-badge" id="cb">0</span></button></div></div></header>
<main class="main-content" id="mc">
  <div class="tab active" id="menuTab">
    <div class="member-bar"><label class="member-label">👤 点菜人：</label><div class="member-select-wrap"><select id="ms" class="member-select" onchange="onMC()"><option value="">-- 选择家人 --</option></select><div class="member-avatar-preview" id="ma">👤</div></div></div>
    <nav class="category-nav" id="cn"></nav>
    <div class="search-bar"><input type="text" id="si" placeholder="🔍 搜索..." oninput="fM()"></div>
    <div class="menu-grid" id="mg"></div>
  </div>
  <div class="tab" id="historyTab"><div class="page-header"><h2>📋 订单历史</h2><button class="btn-text" onclick="clH()">🗑️ 清空</button></div><div class="history-list" id="hl"></div></div>
  <div class="tab" id="manageTab"><div class="page-header"><h2>⚙️ 管理</h2></div>
    <nav class="manage-subnav" id="mn"><button class="subnav-btn active" data-m="dishes">🍽️ 菜品</button><button class="subnav-btn" data-m="categories">📂 分类</button><button class="subnav-btn" data-m="members">👤 家人</button><button class="subnav-btn" data-m="data">💾 备份</button></nav>
    <div class="manage-panel active" id="mpDishes"><div class="panel-toolbar"><span class="panel-count" id="dc"></span><button class="btn-primary btn-sm" onclick="oD()">＋ 添加</button></div><div class="manage-dish-list" id="mdl"></div></div>
    <div class="manage-panel" id="mpCategories"><div class="panel-toolbar"><button class="btn-primary btn-sm" onclick="oC()">＋ 添加</button></div><div class="manage-cat-list" id="mcl"></div></div>
    <div class="manage-panel" id="mpMembers"><div class="panel-toolbar"><button class="btn-primary btn-sm" onclick="oM()">＋ 添加</button></div><div class="manage-member-list" id="mml"></div></div>
    <div class="manage-panel" id="mpData">
      <div class="data-section"><h3>🔐 修改密码</h3><div style="display:flex;gap:8px;"><input type="password" id="np" placeholder="新密码" maxlength="20" style="flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;"><button class="btn-primary btn-sm" onclick="chP()">修改</button></div></div>
      <div class="data-section"><h3>📤 导出备份</h3><p class="data-desc">下载包含所有数据的备份文件，微信发给家人</p><button class="btn-primary" onclick="exp()">📥 下载备份文件</button><button class="btn-outline" style="margin-left:6px;" onclick="cpy()">📋 复制数据</button></div>
      <div class="data-section"><h3>📥 导入备份</h3><p class="data-desc">从家人发来的备份文件恢复</p><input type="file" id="if" accept=".json" onchange="imp(event)" style="display:none"><button class="btn-outline" onclick="if.click()">📂 选择文件</button></div>
      <div class="data-section"><h3>🔄 恢复默认</h3><p class="data-desc">恢复 29 道默认菜品<strong>，会清除已有数据！</strong></p><button class="btn-danger" onclick="rst()">⚠️ 恢复默认</button></div>
    </div>
  </div>
</main>
</div>

<!-- 购物车 -->
<div class="cart-overlay" id="co" onclick="lC()"></div>
<aside class="cart-panel" id="cp"><div class="cart-header"><h2>🛒 点菜清单</h2><button class="btn-close" onclick="lC()">✕</button></div><div class="cart-list" id="cl"></div><div class="cart-empty" id="ce"><p>🛒</p><p>空空如也~</p></div><div class="cart-footer" id="cf"><div class="cart-total"><span>共<strong id="cc">0</strong>道</span><span>¥<span id="ct">0</span></span></div><textarea id="cnote" placeholder="📝 备注（例：少放盐）" rows="2" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;margin-bottom:8px;resize:vertical;font-family:inherit;"></textarea><button class="btn-submit" onclick="sO()">📝 提交订单</button></div></aside>

<!-- 确认订单 -->
<div class="modal-overlay" id="com"><div class="modal modal-lg"><div class="modal-header"><h3>📝 确认订单</h3></div><div class="modal-body"><div id="cmb"></div></div><div class="modal-footer"><button class="btn-cancel" onclick="lM()">再改改</button><button class="btn-confirm" onclick="cO()">✅ 下单</button></div></div></div>

<!-- 菜品弹窗 -->
<div class="modal-overlay" id="dm"><div class="modal"><div class="modal-header"><h3 id="dt">添加</h3></div><div class="modal-body"><input type="hidden" id="di">
<div class="form-group"><label>图片</label><div class="image-upload-area"><div class="image-upload-preview" id="dp"><span class="image-placeholder">🥘</span></div><div class="image-upload-actions"><button type="button" class="btn-outline btn-sm" onclick="diF.click()">📷</button><button type="button" class="btn-text btn-sm" id="dcb" style="display:none" onclick="clD()">移除</button></div><input type="file" id="diF" accept="image/*" onchange="hD(event)" style="display:none"></div></div>
<div class="form-group"><label>Emoji</label><div class="emoji-picker-wrap"><input type="text" id="de" maxlength="4"><span class="emoji-preview-simple" id="dep">🍖</span></div></div>
<div class="form-group"><label>名称<span class="required">*</span></label><input type="text" id="dn"></div>
<div class="form-group"><label>分类<span class="required">*</span></label><select id="dcat"></select></div>
<div class="form-group"><label>价格<span class="required">*</span></label><input type="number" id="dpr" min="0" step="1"></div>
<div class="form-group"><label>描述</label><input type="text" id="dde"></div>
</div><div class="modal-footer"><button class="btn-cancel" onclick="clDM()">取消</button><button class="btn-confirm" onclick="sD()">💾 保存</button></div></div></div>

<!-- 分类弹窗 -->
<div class="modal-overlay" id="catm"><div class="modal modal-sm"><div class="modal-header"><h3 id="catt">添加</h3></div><div class="modal-body"><input type="hidden" id="coid"><div class="form-group"><label>名称<span class="required">*</span></label><input type="text" id="cnm"></div><div class="form-group"><label>Emoji</label><div class="emoji-picker-wrap"><input type="text" id="cem" maxlength="4"><span class="emoji-preview-simple" id="cep">📂</span></div></div></div><div class="modal-footer"><button class="btn-cancel" onclick="clCM()">取消</button><button class="btn-confirm" onclick="sC()">💾 保存</button></div></div></div>

<!-- 家人弹窗 -->
<div class="modal-overlay" id="memm"><div class="modal modal-sm"><div class="modal-header"><h3 id="memt">添加</h3></div><div class="modal-body"><input type="hidden" id="moid"><div class="form-group"><label>头像</label><div class="avatar-upload-area"><div class="avatar-upload-preview" id="map"><span class="avatar-placeholder">👤</span></div><div class="avatar-upload-actions"><button type="button" class="btn-outline btn-sm" onclick="maF.click()">📷</button><button type="button" class="btn-text btn-sm" id="mab" style="display:none" onclick="clM()">移除</button></div><input type="file" id="maF" accept="image/*" onchange="hM(event)" style="display:none"></div></div><div class="form-group"><label>称呼<span class="required">*</span></label><input type="text" id="mnm"></div></div><div class="modal-footer"><button class="btn-cancel" onclick="clMM()">取消</button><button class="btn-confirm" onclick="sM()">💾 保存</button></div></div></div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
