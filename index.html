<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e74c3c">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<title>🏠 家庭点菜</title>
</head>
<body>

<!-- 登录/配置 -->
<div class="screen" id="authScreen">
  <div class="auth-container"><div class="auth-card" style="text-align:center;">
    <div class="auth-logo">🏠</div>
    <div class="auth-title" id="authTitle">登录</div>
    <div class="auth-error" id="authErr"></div>
    <div id="cfgBox" style="display:none;margin-bottom:12px;padding:10px;background:#fef5e7;border-radius:8px;">
      <p style="font-size:0.8rem;margin-bottom:6px;">⚙️ 首次使用，请输入 CloudBase 环境ID</p>
      <p style="font-size:0.7rem;color:var(--text-light);margin-bottom:6px;">去 <a href="https://console.cloud.tencent.com/tcb" target="_blank" style="color:var(--primary);">cloud.tencent.com</a> 云开发控制台复制</p>
      <input type="text" id="cfgEnv" placeholder="环境ID" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:0.85rem;text-align:center;">
    </div>
    <form onsubmit="hA(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="au" required></div>
      <div class="form-group"><label>密码</label><input type="password" id="ap" required minlength="6"></div>
      <button type="submit" class="btn-auth" id="aBtn">登录</button>
    </form>
    <div class="auth-switch"><span id="aSwT">还没账号？</span> <a onclick="tM()" id="aSwL">去注册</a></div>
  </div></div>
</div>

<!-- 家庭 -->
<div class="screen" id="famScreen"><div class="family-container"><div class="family-card">
  <div class="family-logo">👨‍👩‍👧‍👦</div><div class="family-title">家庭设置</div>
  <div class="family-tabs"><button class="family-tab active" onclick="fT('c')">🏡 创建</button><button class="family-tab" onclick="fT('j')">🔗 加入</button></div>
  <div class="family-panel active" id="fpC"><div class="form-group"><label>家庭名称</label><input type="text" id="fn"></div><button class="btn-auth" onclick="cF()">🏡 创建</button><div id="fcOk" style="display:none;margin-top:16px;text-align:center;padding:14px;background:#edf7f0;border-radius:8px;"><p>✅ 创建成功！邀请码：</p><p class="family-code-display" id="fcCode"></p></div></div>
  <div class="family-panel" id="fpJ"><div class="form-group"><label>邀请码</label><input type="text" id="fjCode" placeholder="6位码" maxlength="6" style="text-align:center;font-size:1.3rem;letter-spacing:6px;"></div><button class="btn-auth" onclick="jF()">🔗 加入</button></div>
  <button class="btn-logout" onclick="lo()">退出</button>
</div></div>

<!-- 主应用 -->
<div class="screen" id="mainScreen">
<header class="header"><div class="header-inner"><h1 class="logo" onclick="sT('menu')">🏠 <span id="hNm"></span></h1><div class="header-actions"><button class="btn-icon" onclick="sT('manage')">⚙️</button><button class="btn-icon" onclick="sT('history')">📋</button><button class="btn-icon cart-badge-wrapper" onclick="togC()">🛒<span class="cart-badge" id="cb">0</span></button></div></div></header>
<main class="main-content">
  <div class="user-bar"><span>👋 <span id="uNm"></span> · <span id="fNm"></span></span><span id="ss" style="font-size:0.78rem;color:var(--text-lighter);"></span></div>
  <div class="tab active" id="menuTab"><div class="member-bar"><label class="member-label">👤 点菜人：</label><div class="member-select-wrap"><select id="ms" class="member-select" onchange="oMC()"><option value="">-- 选择家人 --</option></select><div class="member-avatar-preview" id="ma">👤</div></div></div><nav class="category-nav" id="cn"></nav><div class="search-bar"><input type="text" id="si" placeholder="🔍 搜索..." oninput="fM()"></div><div class="menu-grid" id="mg"></div></div>
  <div class="tab" id="historyTab"><div class="page-header"><h2>📋 订单</h2><button class="btn-text" onclick="clH()">🗑️</button></div><div class="history-list" id="hl"></div></div>
  <div class="tab" id="manageTab"><div class="page-header"><h2>⚙️ 管理</h2></div><nav class="manage-subnav" id="mn"><button class="subnav-btn active" data-m="d">🍽️ 菜品</button><button class="subnav-btn" data-m="c">📂 分类</button><button class="subnav-btn" data-m="m">👤 家人</button></nav>
    <div class="manage-panel active" id="mpD"><div class="panel-toolbar"><span class="panel-count" id="dc"></span><button class="btn-primary btn-sm" onclick="oD()">＋</button></div><div class="manage-dish-list" id="mdl"></div></div>
    <div class="manage-panel" id="mpC"><div class="panel-toolbar"><button class="btn-primary btn-sm" onclick="oC()">＋</button></div><div class="manage-cat-list" id="mcl"></div></div>
    <div class="manage-panel" id="mpM"><div class="panel-toolbar"><button class="btn-primary btn-sm" onclick="oM()">＋</button></div><div class="manage-member-list" id="mml"></div></div>
  </div>
</main>
</div>

<!-- 购物车 -->
<div class="cart-overlay" id="co" onclick="lC()"></div><aside class="cart-panel" id="cp"><div class="cart-header"><h2>🛒 点菜清单</h2><button class="btn-close" onclick="lC()">✕</button></div><div class="cart-list" id="cl"></div><div class="cart-empty" id="ce"><p>🛒</p><p>空空如也~</p></div><div class="cart-footer" id="cf"><div class="cart-total"><span>共<strong id="cc">0</strong>道</span><span>¥<span id="ct">0</span></span></div><textarea id="cnn" placeholder="📝 备注" rows="2" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:0.85rem;margin-bottom:8px;resize:vertical;font-family:inherit;"></textarea><button class="btn-submit" onclick="sO()">📝 提交</button></div></aside>

<!-- 确认订单 -->
<div class="modal-overlay" id="com"><div class="modal modal-lg"><div class="modal-header"><h3>📝 确认订单</h3></div><div class="modal-body"><div id="cmb"></div></div><div class="modal-footer"><button class="btn-cancel" onclick="lM()">再改改</button><button class="btn-confirm" onclick="cO()">✅ 下单</button></div></div></div>

<!-- 菜品弹窗 -->
<div class="modal-overlay" id="dm"><div class="modal"><div class="modal-header"><h3 id="dt">添加</h3></div><div class="modal-body"><input type="hidden" id="di">
<div class="form-group"><label>图片</label><div class="image-upload-area"><div class="image-upload-preview" id="dp"><span class="image-placeholder">🥘</span></div><div class="image-upload-actions"><button type="button" class="btn-outline btn-sm" onclick="diF.click()">📷</button><button type="button" class="btn-text btn-sm" id="dcb" style="display:none" onclick="clD()">移除</button></div><input type="file" id="diF" accept="image/*" onchange="hD(event)" style="display:none"></div></div>
<div class="form-group"><label>Emoji</label><div class="emoji-picker-wrap"><input type="text" id="de" maxlength="4"><span class="emoji-preview-simple" id="dep">🍖</span></div></div>
<div class="form-group"><label>名称<span class="required">*</span></label><input type="text" id="dn"></div>
<div class="form-group"><label>分类<span class="required">*</span></label><select id="dcat"></select></div>
<div class="form-group"><label>价格<span class="required">*</span></label><input type="number" id="dpr" min="0" step="1"></div>
<div class="form-group"><label>描述</label><input type="text" id="dde"></div></div>
<div class="modal-footer"><button class="btn-cancel" onclick="clDM()">取消</button><button class="btn-confirm" onclick="sD()">💾 保存</button></div></div></div>

<!-- 分类弹窗 -->
<div class="modal-overlay" id="catm"><div class="modal modal-sm"><div class="modal-header"><h3 id="catt">添加</h3></div><div class="modal-body"><input type="hidden" id="coid"><div class="form-group"><label>名称<span class="required">*</span></label><input type="text" id="cnm"></div><div class="form-group"><label>Emoji</label><div class="emoji-picker-wrap"><input type="text" id="cem" maxlength="4"><span class="emoji-preview-simple" id="cep">📂</span></div></div></div><div class="modal-footer"><button class="btn-cancel" onclick="clCM()">取消</button><button class="btn-confirm" onclick="sC()">💾 保存</button></div></div></div>

<!-- 家人弹窗 -->
<div class="modal-overlay" id="memm"><div class="modal modal-sm"><div class="modal-header"><h3 id="memt">添加</h3></div><div class="modal-body"><input type="hidden" id="moid"><div class="form-group"><label>头像</label><div class="avatar-upload-area"><div class="avatar-upload-preview" id="map"><span class="avatar-placeholder">👤</span></div><div class="avatar-upload-actions"><button type="button" class="btn-outline btn-sm" onclick="maF.click()">📷</button><button type="button" class="btn-text btn-sm" id="mab" style="display:none" onclick="clM()">移除</button></div><input type="file" id="maF" accept="image/*" onchange="hM(event)" style="display:none"></div></div><div class="form-group"><label>称呼<span class="required">*</span></label><input type="text" id="mnm"></div></div><div class="modal-footer"><button class="btn-cancel" onclick="clMM()">取消</button><button class="btn-confirm" onclick="sM()">💾 保存</button></div></div></div>

<div class="toast" id="toast"></div>
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.1/cloudbase.full.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
